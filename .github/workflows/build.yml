# Compile LaGo pour Android (APK + AAB) et iOS (IPA non signée).
# GitHub › Actions › « Build LaGo » › Run workflow  -> fichiers dans « Artifacts ».
# En cas d'échec, les dernières lignes d'erreur s'affichent directement sur la page « Summary » du run.
name: Build LaGo

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL du serveur LaGo (vide = application 100 % locale)"
        required: false
        default: ""
  push:
    tags: ["v*"]

env:
  FLUTTER_VERSION: "3.35.x"
  API_URL: ${{ github.event.inputs.api_url }}

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  # v5 — tests de l'API (paiement, SMS/WhatsApp, communauté…), sans accès réseau externe
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du serveur
        run: cd server && node --test test/*.test.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Vérifier la structure du dépôt
        run: |
          test -f pubspec.yaml || { echo "::error::pubspec.yaml introuvable à la racine du dépôt. Mettez le CONTENU du dossier lago_flutter à la racine."; ls -la; exit 1; }
          flutter --version

      - name: Dépendances
        run: flutter pub get 2>&1 | tee pub.log

      - name: Préparer les projets natifs (android/ios)
        run: dart run tool/setup.dart 2>&1 | tee setup.log

      - name: Analyse du code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Tests
        run: flutter test 2>&1 | tee test.log

      - name: APK
        run: flutter build apk --release --dart-define=LAGO_API_URL=$API_URL 2>&1 | tee apk.log

      - name: App Bundle (Play Store)
        run: flutter build appbundle --release --dart-define=LAGO_API_URL=$API_URL 2>&1 | tee aab.log

      - uses: actions/upload-artifact@v4
        with:
          name: lago-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Résumé des erreurs
        if: failure()
        run: |
          {
            echo "## ❌ Échec Android — dernières lignes"
            for f in pub.log setup.log analyze.log test.log apk.log aab.log; do
              [ -f "$f" ] || continue
              echo "### $f"; echo '```'; grep -iE "error|erreur|exception|failed|échec|because|conflict" "$f" | tail -40 || true; echo '---'; tail -40 "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dépendances
        run: flutter pub get 2>&1 | tee pub.log

      - name: Préparer les projets natifs (android/ios)
        run: dart run tool/setup.dart 2>&1 | tee setup.log

      - name: Compilation iOS (sans signature)
        run: flutter build ios --release --no-codesign --dart-define=LAGO_API_URL=$API_URL 2>&1 | tee ios.log

      - name: Emballer en .ipa non signée
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr LaGo-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: lago-ios-unsigned
          path: LaGo-unsigned.ipa

      - name: Résumé des erreurs
        if: failure()
        run: |
          {
            echo "## ❌ Échec iOS — dernières lignes"
            for f in pub.log setup.log ios.log; do
              [ -f "$f" ] || continue
              echo "### $f"; echo '```'; grep -iE "error|erreur|exception|failed|échec|because|conflict" "$f" | tail -40 || true; echo '---'; tail -40 "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
